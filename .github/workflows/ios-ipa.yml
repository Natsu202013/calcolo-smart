name: Build iOS IPA

on:
  # Pulsante "Run workflow" nella scheda Actions
  workflow_dispatch:
  # Build automatica ad ogni push su main
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ios:
    name: Compila IPA (macOS)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 1. Scarica il codice
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # RETe DI SICUREZZA: trova da sola la cartella del progetto.
      # Funziona sia se i file sono alla radice, sia se sono dentro
      # una sottocartella (es. calcolo-smart/lib/...).
      # ---------------------------------------------------------------
      - name: 2. Trova la cartella del progetto
        run: |
          set -euo pipefail
          CANDIDATE=$(find . -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' \
            -not -path '*/Pods/*' \
            | head -1)
          if [ -z "$CANDIDATE" ]; then
            echo "::error::pubspec.yaml non trovato nel repository."
            echo "Verifica di aver caricato la cartella lib/ e pubspec.yaml."
            find . -maxdepth 3 -type d | head -30
            exit 1
          fi
          PROJECT_ROOT=$(cd "$(dirname "$CANDIDATE")" && pwd)
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "✅ Progetto trovato in: $PROJECT_ROOT"
          echo "--- contenuto ---"
          ls -A "$PROJECT_ROOT"

      - name: 3. Installa Flutter 3.35.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: 4. Versioni toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          flutter --version

      - name: 5. Dipendenze
        run: cd "$PROJECT_ROOT" && flutter pub get

      - name: 6. Analisi e test
        run: cd "$PROJECT_ROOT" && flutter analyze && flutter test

      - name: 7. Compila in release senza firma
        run: |
          cd "$PROJECT_ROOT"
          flutter build ios --release --no-codesign \
            --dart-define=flutter.inspector.structuredErrors=false

      - name: 8. Impacchetta l'IPA
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Runner.app non trovato"
            find build -maxdepth 4 -name "*.app" || true
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          ( cd build/ipa && zip -qry ipa.zip Payload )
          mv build/ipa/ipa.zip "$GITHUB_WORKSPACE/CalcoloSmart.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "$GITHUB_WORKSPACE/CalcoloSmart.app.zip"
          cd "$GITHUB_WORKSPACE"
          ls -lh CalcoloSmart.ipa CalcoloSmart.app.zip
          shasum -a 256 CalcoloSmart.ipa > CalcoloSmart.ipa.sha256
          cat CalcoloSmart.ipa.sha256
          du -h CalcoloSmart.ipa | cut -f1 >> "$GITHUB_ENV" 2>/dev/null || true

      - name: 9. Carica l'IPA come artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalcoloSmart-ipa
          path: |
            CalcoloSmart.ipa
            CalcoloSmart.app.zip
            CalcoloSmart.ipa.sha256
          retention-days: 30
          if-no-files-found: error

      - name: 10. Riepilogo
        run: |
          {
            echo "## ✅ IPA generato"
            echo ""
            echo "Scarica il file dalla sezione **Artifacts** in fondo a questa pagina."
            echo ""
            echo "- \`CalcoloSmart.ipa\` — pacchetto iOS"
            echo "- \`CalcoloSmart.app.zip\` — bundle .app"
            echo "- \`CalcoloSmart.ipa.sha256\` — checksum"
            echo ""
            echo "Bundle ID: \`com.calcolosmart.calculator\`"
            echo ""
            echo "> L'IPA non è firmato: per installarlo serve Sideloadly o AltStore."
          } >> "$GITHUB_STEP_SUMMARY"
